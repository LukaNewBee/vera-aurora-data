name: Update ECMWF Cloud Forecast

on:
  workflow_dispatch:

  schedule:
    - cron: "50 1,7,13,19 * * *"


permissions:
  contents: write


jobs:

  update-weather:

    runs-on: ubuntu-latest

    timeout-minutes: 30


    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Check ecCodes
        run: |
          python -m eccodes selfcheck


      - name: Download ECMWF forecast
        run: |
          python fetch_ecmwf.py


      - name: Check generated JSON
        run: |
          ls -lh data/
          python -m json.tool data/ecmwf_cloud.json > /dev/null
          echo "JSON validation successful"


      - name: Commit updated forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ecmwf_cloud.json

          if git diff --cached --quiet; then
            echo "No forecast changes to commit."
          else
            git commit -m "Update ECMWF cloud forecast"
            git push
          fi
